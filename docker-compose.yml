services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/taskflow.db
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-me}
      FRONTEND_URL: http://localhost:5173
    volumes:
      - taskflow-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  taskflow-data:
